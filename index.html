<!DOCTYPE html>
<html lang="pt-BR" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lanchonete - Cardápio Digital</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Ícones Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Fontes do Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            brand: {
              red: '#E53E3E',
              gold: '#ECC94B',
              dark: '#0F0F12',
            },
            dark: {
              800: '#18181B',
              900: '#121215',
              950: '#09090B',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-black text-neutral-100 font-sans antialiased min-h-screen flex flex-col selection:bg-brand-red selection:text-white pb-24 md:pb-0">

  <!-- Header / Navbar -->
  <header class="sticky top-0 z-40 bg-black/80 backdrop-blur-xl border-b border-white/10 transition-all">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      
      <!-- Logo / Nome -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-red to-orange-500 flex items-center justify-center font-extrabold text-white text-xl shadow-lg shadow-brand-red/30">
          L
        </div>
        <div>
          <h1 class="font-extrabold text-lg leading-tight tracking-tight text-white">Lanchonete</h1>
          <p class="text-xs text-neutral-400 font-medium">Sabor & Qualidade</p>
        </div>
      </div>

      <!-- Ações (Carrinho) -->
      <div class="flex items-center gap-4">
        <button onclick="toggleCart()" class="relative p-3 rounded-2xl bg-dark-900 hover:bg-dark-800 border border-white/10 transition flex items-center justify-center text-white">
          <i data-lucide="shopping-bag" class="w-5 h-5"></i>
          <span id="cart-count" class="hidden absolute -top-1.5 -right-1.5 bg-brand-red text-white text-[11px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-black">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Banner Hero -->
  <section class="relative py-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto w-full">
    <div class="relative rounded-3xl overflow-hidden bg-gradient-to-r from-neutral-900 to-dark-950 border border-white/10 p-8 md:p-12">
      <div class="max-w-xl space-y-4">
        <span class="inline-block px-3 py-1 bg-brand-red/20 text-brand-red border border-brand-red/30 rounded-full text-xs font-bold uppercase tracking-wider">
          O melhor da cidade
        </span>
        <h2 class="text-3xl md:text-5xl font-black text-white tracking-tight leading-tight">
          Faça seu pedido online rápido e fácil.
        </h2>
        <p class="text-neutral-400 text-sm md:text-base font-light">
          Lanches artesanais, combos completos e bebidas trincando de geladas.
        </p>
      </div>
    </div>
  </section>

  <!-- Destaques -->
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full space-y-4">
    <h3 class="text-lg font-bold text-white flex items-center gap-2">
      <i data-lucide="sparkles" class="w-5 h-5 text-brand-gold"></i> Mais Pedidos
    </h3>
    <div id="destaques-grid" class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <!-- Injetado pelo JS -->
    </div>
  </section>

  <!-- Navegação por Categorias (Tabs) -->
  <section class="sticky top-20 z-30 bg-black/95 backdrop-blur-md border-y border-white/10 py-4 my-6">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div id="categories-tabs" class="flex gap-2 overflow-x-auto no-scrollbar scroll-smooth">
        <!-- Injetado pelo JS -->
      </div>
    </div>
  </section>

  <!-- Grid de Produtos -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full flex-1">
    <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <!-- Injetado pelo JS -->
    </div>
  </main>

  <!-- Drawer do Carrinho -->
  <div id="cart-drawer" class="fixed inset-y-0 right-0 z-50 w-full max-w-md bg-dark-900 border-l border-white/10 transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col justify-between shadow-2xl">
    
    <!-- Topo do Carrinho -->
    <div class="p-6 border-b border-white/10 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i data-lucide="shopping-bag" class="w-5 h-5 text-white"></i>
        <h3 class="font-bold text-lg text-white">Seu Pedido</h3>
      </div>
      <button onclick="toggleCart()" class="p-2 rounded-xl text-neutral-400 hover:text-white hover:bg-white/5 transition">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Lista de Itens -->
    <div id="cart-items" class="p-6 flex-1 overflow-y-auto space-y-4">
      <!-- Injetado pelo JS -->
    </div>

    <!-- Rodapé do Carrinho -->
    <div class="p-6 border-t border-white/10 space-y-4 bg-dark-950">
      <div class="flex justify-between items-center text-white font-bold text-lg">
        <span>Total</span>
        <span id="cart-total" class="text-brand-gold">R$ 0,00</span>
      </div>
      <button id="checkout-btn" disabled onclick="alert('Indo para checkout!')" class="w-full bg-brand-red disabled:opacity-50 hover:bg-red-600 text-white font-bold py-4 rounded-2xl transition shadow-lg shadow-brand-red/20 flex items-center justify-center gap-2">
        Finalizar Pedido <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <!-- Scripts do Projeto ajustados para os caminhos atuais -->
  <script src="js/app.js"></script>
  <script src="js/jscheckout.js"></script>
  <script src="js/jspix.js"></script>
</body>
</html>
